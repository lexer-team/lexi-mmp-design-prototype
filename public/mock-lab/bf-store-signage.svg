      <text x="26" y="86" fill="#A82071" font-size="34" font-family="'Mona Sans', Arial, sans-serif" font-weight="800">BLACK</text>
      <text x="26" y="130" fill="#A82071" font-size="34" font-family="'Mona Sans', Arial, sans-serif" font-weight="800">FRIDAY</text>
